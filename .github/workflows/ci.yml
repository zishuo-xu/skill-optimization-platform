name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend acceptance tests (A01–A20)
        env:
          SKILLOPT_DISABLE_WORKER: "1"
        run: python -m pytest -q

      - name: Frontend & shell syntax check
        run: |
          for f in web/js/*.js web/js/views/*.js; do node --check "$f"; done
          bash -n start.sh scripts/setup.sh run.sh

      - name: Seed demo project (smoke test)
        run: python -m app.seed

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: start.bat --help
        run: cmd /c start.bat --help

      - name: start.bat --seed-only (one-click setup + demo seed)
        run: cmd /c start.bat --seed-only

      - name: start.bat server smoke (health + SPA)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList '/c start.bat --no-open' -PassThru -NoNewWindow
          $healthy = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:8765/api/v3/healthz'
              if ($r.StatusCode -eq 200) { $healthy = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $healthy) {
            & taskkill /PID $proc.Id /T /F | Out-Null
            throw 'server did not become healthy'
          }
          $page = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 'http://127.0.0.1:8765/'
          if ($page.StatusCode -ne 200) {
            & taskkill /PID $proc.Id /T /F | Out-Null
            throw 'index.html was not served'
          }
          $oldPid = (Get-NetTCPConnection -LocalPort 8765 -State Listen).OwningProcess
          Write-Host "server PID before restart: $oldPid"
          & cmd /c start.bat --seed-only | Out-Host
          if ($LASTEXITCODE -ne 0) {
            & taskkill /PID $proc.Id /T /F | Out-Null
            throw 'start.bat --seed-only failed while restarting'
          }
          Start-Sleep -Seconds 1
          $stillListening = Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue
          if ($stillListening) {
            & taskkill /PID $proc.Id /T /F | Out-Null
            throw 'start.bat did not stop the existing server'
          }
          Write-Host 'Windows one-click startup + kill-existing OK'
